rebuild_energy_history:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: vimar_cloud
          domain: sensor
          device_class: energy
    start:
      required: true
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    source:
      required: false
      default: power
      selector:
        select:
          translation_key: rebuild_source
          options:
            - power
            - vimar
